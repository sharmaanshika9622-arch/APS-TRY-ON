<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APS SmartFit AI - Fullscreen Uniform Experience</title>

  <!-- MediaPipe Pose Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --card-border: rgba(15, 23, 42, 0.08);
      --accent-green: #059669;
      --accent-light-green: #10b981;
      --accent-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --status-bg: rgba(16, 185, 129, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      border-bottom: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
    }

    .brand-logo { display: flex; align-items: center; gap: 12px; }
    .logo-badge {
      background: #0f172a;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 8px;
    }
    .brand-title { font-size: 1.1rem; font-weight: 700; }
    .brand-subtitle { font-size: 0.75rem; color: var(--text-muted); }

    .status-pill {
      background: var(--status-bg);
      color: var(--accent-green);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot { width: 7px; height: 7px; background: var(--accent-green); border-radius: 50%; }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 20px;
      width: 100%;
    }

    /* FULL-SCREEN CAMERA SECTION */
    .viewport-card {
      background: #000000;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
      position: relative;
      width: 100%;
      height: 75vh;
      min-height: 550px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder-text {
      color: #94a3b8;
      font-size: 1.1rem;
      z-index: 1;
      text-align: center;
      background: rgba(15, 23, 42, 0.7);
      padding: 12px 24px;
      border-radius: 12px;
    }

    /* Floating Distance Calibration Alert */
    .distance-banner {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
      z-index: 2;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* ACTION BAR BELOW CAMERA */
    .action-bar {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 16px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-primary { background: var(--accent-green); color: #ffffff; }
    .btn-primary:hover { background: #047857; }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover { background: #f1f5f9; }

    .btn-capture {
      background: #0f172a;
      color: #ffffff;
    }
    .btn-capture:hover { background: #1e293b; }

    /* SIZE DISPLAY & CONTROLS DASHBOARD (BELOW CAMERA) */
    .controls-dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-top: 25px;
    }

    .dashboard-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
    }

    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .sidebar-label {
      text-transform: uppercase;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* Interactive Size Mode Selector Button */
    .mode-toggle-group {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }

    .toggle-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
    }

    .toggle-btn.active {
      background: #ffffff;
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .size-display-box {
      background: #f8fafc;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px;
      text-align: center;
    }

    .size-main-number {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--accent-green);
      line-height: 1;
      margin-top: 8px;
    }

    .adjustment-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .slider-row input[type="range"] {
      width: 60%;
      accent-color: var(--accent-green);
      cursor: pointer;
    }

    input[type="file"] { display: none; }

    @media (max-width: 900px) {
      .controls-dashboard { grid-template-columns: 1fr; }
      .viewport-card { height: 50vh; }
      .action-bar { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="brand-logo">
      <div class="logo-badge">APS</div>
      <div>
        <div class="brand-title">APS SmartFit</div>
        <div class="brand-subtitle">AI Virtual Fitting Room</div>
      </div>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      CALIBRATED FOR 1 METER
    </div>
  </header>

  <div class="container">
    
    <!-- FULL SCREEN CAMERA VIEWPORT -->
    <div class="viewport-card">
      <div class="distance-banner">📏 Stand approximately 1 meter (3 feet) from camera</div>
      <video id="webcam" playsinline style="display:none;"></video>
      <canvas id="output-canvas" width="1280" height="720"></canvas>
      <span class="placeholder-text" id="placeholder-text">Start camera or upload photo to view full-screen preview</span>
    </div>

    <!-- MAIN CONTROL BUTTONS BELOW CAMERA -->
    <div class="action-bar">
      <button class="btn btn-primary" onclick="startWebcam()">📷 Live Camera</button>
      <label class="btn btn-secondary">
        📁 Upload Photo
        <input type="file" id="image-upload" accept="image/*" onchange="handleImageUpload(event)">
      </label>
      <button class="btn btn-capture" onclick="takeSnapshot()">📸 Take Photo</button>
    </div>

    <!-- CONTROL DASHBOARD BELOW CAMERA -->
    <div class="controls-dashboard">
      
      <!-- Recommended Size Card -->
      <div class="dashboard-card">
        <div class="card-title-row">
          <span class="sidebar-label">Recommended Size (at 1 Meter)</span>
          <div class="mode-toggle-group">
            <button class="toggle-btn active" id="btn-alpha" onclick="setSizeMode('alpha')">Alphabetical</button>
            <button class="toggle-btn" id="btn-num" onclick="setSizeMode('numeric')">Numeric</button>
          </div>
        </div>

        <div class="size-display-box">
          <div class="sidebar-label" id="size-mode-label">ALPHA SIZE</div>
          <div class="size-main-number" id="size-display">--</div>
        </div>
      </div>

      <!-- Fine-Tune Manual Overlay Adjustments -->
      <div class="dashboard-card">
        <div class="card-title-row">
          <span class="sidebar-label">Fine Tune Fit Overlay</span>
        </div>
        <div class="adjustment-group">
          <div class="slider-row">
            <span>Uniform Scale</span>
            <input type="range" id="scale-slider" min="1.8" max="4.5" step="0.05" value="3.20">
          </div>
          <div class="slider-row">
            <span>Vertical Offset</span>
            <input type="range" id="y-slider" min="-0.20" max="0.40" step="0.01" value="0.05">
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const sizeDisplay = document.getElementById('size-display');
    const sizeModeLabel = document.getElementById('size-mode-label');
    const placeholderText = document.getElementById('placeholder-text');

    const scaleSlider = document.getElementById('scale-slider');
    const ySlider = document.getElementById('y-slider');

    const uniformImg = new Image();
    uniformImg.src = 'uniform.png';

    let pose;
    let camera;
    let currentSourceImage = null;
    let currentSizeMode = 'alpha'; // Default mode: 'alpha' or 'numeric'

    // Real-world shoulder pixel distance calibration at 1 meter distance
    function calculateSize(shoulderPx) {
      const alphaSizes = ["XXS", "XS", "S", "M", "L", "XL", "XXL", "XXXL"];
      const numSizes   = ["28",  "30", "32", "34", "36", "38",  "40",  "42"];

      let idx = 0;
      if (shoulderPx < 180) idx = 0;
      else if (shoulderPx < 210) idx = 1;
      else if (shoulderPx < 240) idx = 2;
      else if (shoulderPx < 270) idx = 3;
      else if (shoulderPx < 300) idx = 4;
      else if (shoulderPx < 330) idx = 5;
      else if (shoulderPx < 360) idx = 6;
      else idx = 7;

      return currentSizeMode === 'alpha' ? alphaSizes[idx] : numSizes[idx];
    }

    // Interactive Size Mode Unit Switcher
    function setSizeMode(mode) {
      currentSizeMode = mode;
      document.getElementById('btn-alpha').classList.toggle('active', mode === 'alpha');
      document.getElementById('btn-num').classList.toggle('active', mode === 'numeric');
      sizeModeLabel.innerText = mode === 'alpha' ? 'ALPHA SIZE' : 'NUMERIC SIZE';
    }

    // Photo Snapshot Capability
    function takeSnapshot() {
      const dataURL = canvasElement.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'APS-Uniform-TryOn.png';
      link.href = dataURL;
      link.click();
    }

    function onResults(results) {
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (currentSourceImage) {
        canvasCtx.drawImage(currentSourceImage, 0, 0, canvasElement.width, canvasElement.height);
      } else if (results.image) {
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      }

      if (results.poseLandmarks) {
        placeholderText.style.display = 'none';
        const landmarks = results.poseLandmarks;
        const leftShoulder = landmarks[11];
        const rightShoulder = landmarks[12];

        if (leftShoulder.visibility > 0.3 && rightShoulder.visibility > 0.3) {
          const lX = leftShoulder.x * canvasElement.width;
          const lY = leftShoulder.y * canvasElement.height;
          const rX = rightShoulder.x * canvasElement.width;
          const rY = rightShoulder.y * canvasElement.height;

          const dx = lX - rX;
          const dy = lY - rY;
          const shoulderDistance = Math.sqrt(dx * dx + dy * dy);
          const angle = Math.atan2(dy, dx);

          sizeDisplay.innerText = calculateSize(shoulderDistance);

          const userScale = parseFloat(scaleSlider.value);
          const userYShift = parseFloat(ySlider.value);

          const uniformWidth = shoulderDistance * userScale;
          const aspectRatio = uniformImg.height / uniformImg.width;
          const uniformHeight = uniformWidth * aspectRatio;

          const midShoulderX = (lX + rX) / 2;
          const midShoulderY = (lY + rY) / 2;

          const anchorY = midShoulderY + (uniformHeight * userYShift);

          canvasCtx.save();
          canvasCtx.translate(midShoulderX, anchorY);
          canvasCtx.rotate(angle);

          canvasCtx.drawImage(
            uniformImg,
            -uniformWidth / 2,
            -uniformHeight * 0.12,
            uniformWidth,
            uniformHeight
          );

          canvasCtx.restore();
        }
      }
    }

    function initPose() {
      pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      pose.onResults(onResults);
    }

    function startWebcam() {
      currentSourceImage = null;
      if (!pose) initPose();
      if (camera) camera.stop();

      videoElement.style.display = 'none';

      camera = new Camera(videoElement, {
        onFrame: async () => {
          if (!currentSourceImage) {
            await pose.send({ image: videoElement });
          }
        },
        width: 1280,
        height: 720
      });

      camera.start();
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (camera) camera.stop();

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = async () => {
          currentSourceImage = img;
          
          canvasElement.width = 1280;
          canvasElement.height = 720;

          if (!pose) initPose();
          await pose.send({ image: img });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    window.onload = () => {
      initPose();
    };
  </script>
</body>
</html>
